id: https://w3id.org/sagebrain/opentargets
name: sagebrain-opentargets
title: SageBrain Open Targets Drug-Layer Ingest
description: >-
  Schema for the Open Targets Platform drug layer, covering ChEMBL compounds, HGNC
  genes, diseases and phenotypes, mechanism and indication associations, and clinical
  trials.

  Target-disease association scores are outside the current scope. Only clinical trial
  records are projected from clinical_report; indication report counts include all
  source record types.

license: https://creativecommons.org/publicdomain/zero/1.0/
default_prefix: sagebrain
default_range: string

prefixes:
  # Local terms share the sagebrain-model namespace. Acceptance checks report
  # terms that have not yet been defined in the published model.
  sagebrain: https://w3id.org/synapse/sagebrain#
  linkml: https://w3id.org/linkml/
  biolink: https://w3id.org/biolink/vocab/
  CHEMBL: "https://identifiers.org/chembl:"
  CLINICALTRIALS: "https://identifiers.org/clinicaltrials:"
  ENSEMBL: "https://identifiers.org/ensembl:"
  HGNC: "https://identifiers.org/hgnc:"
  EFO: http://www.ebi.ac.uk/efo/
  obo: http://purl.obolibrary.org/obo/
  ORDO: http://www.orpha.net/ORDO/
  NCBITaxon: http://purl.obolibrary.org/obo/NCBITaxon_
  infores: https://w3id.org/biolink/infores/
  skos: http://www.w3.org/2004/02/skos/core#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  dcterms: http://purl.org/dc/terms/
  pav: http://purl.org/pav/
  prov: http://www.w3.org/ns/prov#
  void: http://rdfs.org/ns/void#
  xsd: http://www.w3.org/2001/XMLSchema#

imports:
  - linkml:types

# Acceptance checks validate emitted Biolink terms against this pinned release.
# Undefined local terms are reported for review in sagebrain-model.
settings:
  biolink_version: 4.4.4
  opentargets_release: "26.06"

# ── enums ─────────────────────────────────────────────────────────────────────

enums:

  ClinicalStageEnum:
    description: >-
      Clinical stages used by Open Targets. Unknown vocabulary values fail validation.
      The vocabulary is shared by molecule, indication, and trial stage properties, each
      with a distinct scope.

      CLINICAL_STAGE_ORDER in opentargets/common.py defines the development-stage
      ordering. UNKNOWN denotes an unrecorded stage and sorts first; PHASE_4 denotes
      post-marketing studies and sorts after APPROVAL. WITHDRAWAL is an outcome and has
      no development-stage rank.
    permissible_values:
      UNKNOWN:
        description: >-
          No clinical stage recorded by the source.
      PRECLINICAL:
      IND:
        description: Investigational New Drug application.
      EARLY_PHASE_1:
      PHASE_1:
      PHASE_1_2:
      PHASE_2:
      PHASE_2_3:
      PHASE_3:
      PREAPPROVAL:
      APPROVAL:
        description: >-
          Approval recorded by the source. Interpret this value in the scope of the
          property carrying it; a molecule-level value does not identify an approved
          indication, jurisdiction, or population.
      PHASE_4:
        description: >-
          Post-marketing study stage. Retained on trial nodes; the source represents
          this stage as APPROVAL at the molecule level.
      WITHDRAWAL:
        description: >-
          Withdrawal after approval. This outcome is excluded from the development-stage
          ordering and occurs outside the projected trial scope in the pinned release.

  TargetTypeEnum:
    description: >-
      ChEMBL target classification, retained on every mechanism association. Single
      protein, chimeric protein, and nucleic-acid denote individual targets. Other
      values denote groups whose members are emitted as separate association objects.

      Associations derived from a group claim do not establish independently measured
      interactions with each member. Filter by target_type when counting individual
      drug-target interactions.
    permissible_values:
      "single protein":
      "chimeric protein":
      "nucleic-acid":
      "protein family":
        description: >-
          A protein family whose members are listed as targets of the same mechanism
          claim.
      "protein complex":
      "protein complex group":
      "protein nucleic-acid complex":
      "protein-protein interaction":
      "selectivity group":

  ActionTypeEnum:
    description: >-
      ChEMBL mechanism action types. Values are retained alongside biolink:affects
      because the source vocabulary does not map consistently to more specific Biolink
      predicates.
    permissible_values:
      ACTIVATOR:
      AGONIST:
      "ALLOSTERIC ANTAGONIST":
      ANTAGONIST:
      "ANTISENSE INHIBITOR":
      "BINDING AGENT":
      BLOCKER:
      "CROSS-LINKING AGENT":
      DEGRADER:
      "DISRUPTING AGENT":
      "EXOGENOUS GENE":
      "EXOGENOUS PROTEIN":
      "GENE EDITING NEGATIVE MODULATOR":
      "HYDROLYTIC ENZYME":
      INHIBITOR:
        description: >-
          An inhibitory action on the target.
      "INVERSE AGONIST":
      MODULATOR:
      "NEGATIVE ALLOSTERIC MODULATOR":
      "NEGATIVE MODULATOR":
      OPENER:
      OTHER:
      "PARTIAL AGONIST":
      "POSITIVE ALLOSTERIC MODULATOR":
      "POSITIVE MODULATOR":
      "PROTEOLYTIC ENZYME":
      "RELEASING AGENT":
      "RNAI INHIBITOR":
      STABILISER:
      SUBSTRATE:
      "VACCINE ANTIGEN":

  DrugTypeEnum:
    description: >-
      Compound modalities as recorded by Open Targets. Values retain distinctions beyond
      the broad Biolink classes assigned by this ingest.
    permissible_values:
      "Small molecule":
        description: >-
          A small molecule, typed as biolink:SmallMolecule.
      Antibody:
      "Antibody drug conjugate":
      Cell:
        description: >-
          A cell therapy. Retained explicitly because the broad biolink:ChemicalEntity
          class does not describe this modality precisely.
      Enzyme:
      Gene:
      Oligonucleotide:
      Oligosaccharide:
      Protein:
      "Vaccine component":
      Unknown:

  ReportTypeEnum:
    description: >-
      Record types in clinical_report, used to validate the trial scope filter. Only
      CLINICAL_TRIAL records are projected as nodes. Other record types use
      heterogeneous identifiers for which this ingest has no stable identity mapping
      across releases.
    permissible_values:
      CLINICAL_TRIAL:
        description: >-
          Clinical trial records sourced from AACT and eligible for projection as trial
          nodes.
      CURATED_RESOURCE:
        description: >-
          Records from curated resources, including TTD, ATC, USAN, INN, WHO, and DOI.
      DRUG_LABEL:
        description: >-
          Drug label records from DailyMed and FDA.
      REGULATORY_AGENCY:
        description: >-
          Regulatory records from PMDA, EMA, FDA, Health Canada, and MHRA.

  TrialStopReasonCategoryEnum:
    description: >-
      Open Targets classifications of the trialWhyStopped text. A trial may carry
      multiple categories, preserving information about why it stopped that a maximum
      clinical stage cannot express.

      Uncategorised, No_Context, and Invalid_Reason are source values. Unrecognized
      values fail vocabulary validation.
    permissible_values:
      Insufficient_Enrollment:
        description: >-
          Insufficient participant enrollment.
      Business_Administrative:
      Negative:
        description: >-
          Negative study results or futility.
      Study_Design:
      Logistics_Resources:
      Invalid_Reason:
        description: The stated reason was not a stop reason.
      Another_Study:
      Safety_Sideeffects:
        description: >-
          Safety concerns or side effects.
      Study_Staff_Moved:
      Covid19:
      Regulatory:
      Uncategorised:
        description: >-
          The source could not classify the stop-reason text.
      No_Context:

  ReportQualityControlEnum:
    description: >-
      Quality-control flags assigned by Open Targets. All flags are retained on trial
      nodes. PHASE_IV_NOT_APPROVED and INDIRECT_PRIMARY_PURPOSE exclude reports from the
      source's clinical_indication dataset; the trial projection does not apply that
      filter.
    permissible_values:
      UNVALIDATED_INDICATION:
        description: >-
          Source flag for an unvalidated indication; does not exclude the report from
          clinical_indication.
      INDIRECT_PRIMARY_PURPOSE:
        description: >-
          Source flag for an indirect primary purpose; excludes the report from
          clinical_indication.
      NO_DISEASE:
        description: >-
          Source flag for a missing disease; does not exclude the report from
          clinical_indication.
      PHASE_IV_NOT_APPROVED:
        description: >-
          Source flag for a post-marketing study without recorded approval; excludes the
          report from clinical_indication.

  ClinicalTrialStatusEnum:
    description: >-
      The trial's overall recruitment or availability status. The source vocabulary
      matches Biolink's ClinicalTrialStatusEnum in the pinned release.

      Status provides context for a stop reason: TERMINATED denotes an early end,
      WITHDRAWN denotes a trial stopped before enrollment, and SUSPENDED denotes a
      temporary halt. WITHDRAWN is distinct from the drug-level WITHDRAWAL outcome in
      ClinicalStageEnum.
    permissible_values:
      COMPLETED:
        description: >-
          The trial ended normally.
      UNKNOWN:
        description: >-
          The registry has no current trial status.
      TERMINATED:
        description: >-
          The trial stopped prematurely and will not resume.
      RECRUITING:
      ACTIVE_NOT_RECRUITING:
      WITHDRAWN:
        description: >-
          The trial stopped before enrolling a participant.
      NOT_YET_RECRUITING:
        description: >-
          The trial has not begun recruiting participants.
      ENROLLING_BY_INVITATION:
      SUSPENDED:
        description: >-
          The trial is temporarily halted and may resume.
      NO_LONGER_AVAILABLE:
      APPROVED_FOR_MARKETING:
      AVAILABLE:
      TEMPORARILY_NOT_AVAILABLE:

  TaxonEnum:
    description: >-
      Taxa represented by gene nodes. Mechanism targets in the current scope are human
      genes.
    permissible_values:
      "NCBITaxon:9606":
        title: Homo sapiens

# ── slots ─────────────────────────────────────────────────────────────────────

slots:

  id:
    identifier: true
    range: uriorcurie
    description: Stable identifier for the node.

  name:
    slot_uri: rdfs:label
    description: Human-readable label.

  alt_label:
    slot_uri: skos:altLabel
    multivalued: true
    description: >-
      Alternative labels supplied by the source. Compound labels include synonyms and
      trade names; disease and phenotype labels use exact synonyms.

      Labels may identify multiple entities. The compound label export records this
      ambiguity for downstream resolution. Compound labels containing control characters
      are excluded from the label index and recorded in reports/rejected_labels.tsv.

  in_taxon:
    slot_uri: biolink:in_taxon
    range: TaxonEnum
    required: true
    description: >-
      The organism to which the gene belongs, emitted explicitly on each gene node.

  drug_type:
    slot_uri: sagebrain:drug_type
    range: DrugTypeEnum
    required: true
    description: The source's modality for this compound, kept verbatim.

  inchi_key:
    slot_uri: sagebrain:inchi_key
    description: >-
      The source InChIKey, supporting compound matching by chemical structure.

  canonical_smiles:
    slot_uri: sagebrain:canonical_smiles
    description: >-
      The source canonical SMILES representation, when available.

  overall_clinical_stage:
    slot_uri: sagebrain:overall_clinical_stage
    range: ClinicalStageEnum
    description: >-
      The compound's highest clinical stage as supplied in maximumClinicalStage. This
      molecule-level value does not identify a disease or an approved indication.

      The value uses the Open Targets stage vocabulary, distinct from ChEMBL's numeric
      max_phase. It is copied from the source and cannot be derived reliably from this
      graph's indication associations.
  parent_molecule:
    slot_uri: sagebrain:parent_molecule
    range: Compound
    description: >-
      The parent molecule of a salt or mixture form, from parentId. The reference is
      retained even when the parent has no descriptive record in the source molecule
      dataset.

  subject:
    slot_uri: biolink:subject
    range: uriorcurie
    required: true

  object:
    slot_uri: biolink:object
    range: uriorcurie
    required: true

  predicate:
    slot_uri: biolink:predicate
    range: uriorcurie
    required: true

  primary_knowledge_source:
    slot_uri: biolink:primary_knowledge_source
    range: uriorcurie
    required: true

  action_type:
    slot_uri: sagebrain:action_type
    range: ActionTypeEnum
    required: true
    description: >-
      The mechanism action recorded by the source, complementing the general
      biolink:affects predicate.

  mechanism_of_action:
    slot_uri: sagebrain:mechanism_of_action
    description: >-
      The source mechanism description. For group targets, this text describes the
      shared mechanism claim represented by the member associations.

  target_type:
    slot_uri: sagebrain:target_type
    range: TargetTypeEnum
    required: true
    description: >-
      The source target classification, used to distinguish individual targets from
      members of a target group. See TargetTypeEnum.

  target_name:
    slot_uri: sagebrain:target_name
    description: >-
      The source target name. For group targets, this names the group rather than the
      individual gene referenced by the association.

  original_object:
    slot_uri: biolink:original_object
    range: string
    description: >-
      The source Ensembl gene identifier before normalization to HGNC, retained as a
      string to preserve the mapping provenance. Unresolved identifiers are recorded in
      reports/unresolved_mechanism_targets.tsv.

  max_clinical_stage:
    slot_uri: sagebrain:max_clinical_stage
    range: ClinicalStageEnum
    required: true
    description: >-
      The highest clinical stage recorded for a drug-disease pair, aggregated by Open
      Targets from its supporting clinical reports. Interpret this value with the
      association's disease or phenotype.

      The maximum does not preserve individual trial outcomes. Report counts and trial
      nodes provide additional context, but differ in scope and are not linked by
      explicit report identifiers.

  clinical_report_count:
    slot_uri: sagebrain:clinical_report_count
    range: integer
    required: true
    description: >-
      The number of supporting report identifiers listed by Open Targets for a
      drug-disease pair. This count spans all report types and is not a count of trial
      nodes in this graph. The source indication filter also differs from the trial
      projection's scope.

  trial_clinical_stage:
    slot_uri: sagebrain:trial_clinical_stage
    range: ClinicalStageEnum
    required: true
    description: >-
      The clinicalStage value for an individual trial. Its scope is distinct from the
      molecule's overall_clinical_stage and the indication association's
      max_clinical_stage.

      A local slot preserves the Open Targets vocabulary, which differs from the
      ResearchPhaseEnum used by biolink:clinical_trial_phase.

  clinical_trial_overall_status:
    slot_uri: biolink:clinical_trial_overall_status
    range: ClinicalTrialStatusEnum
    required: true
    description: >-
      The trialOverallStatus value for the trial. Interpreted alongside stop reasons to
      distinguish early termination, withdrawal before enrollment, and temporary
      suspension.

  trial_start_date:
    slot_uri: sagebrain:trial_start_date
    range: string
    description: >-
      The source trial start date at month precision, emitted as xsd:gYearMonth. Older
      source records may have a day supplied during normalization, so the projection
      retains only the year and month.

      Dates outside the configured plausibility window are omitted and recorded in
      reports/implausible_trial_dates.tsv; their trial nodes are retained. The schema
      uses a string range, while acceptance checks validate the RDF datatype and date
      window.

  trial_stop_reason:
    slot_uri: sagebrain:trial_stop_reason
    description: >-
      The registry text describing why the trial stopped, retained alongside the source
      categories to preserve details that the categories may omit.

  trial_stop_reason_category:
    slot_uri: sagebrain:trial_stop_reason_category
    range: TrialStopReasonCategoryEnum
    multivalued: true
    description: >-
      Open Targets classifications of the trial stop reason. A trial may have multiple
      categories; see TrialStopReasonCategoryEnum.

  trial_quality_control:
    slot_uri: sagebrain:trial_quality_control
    range: ReportQualityControlEnum
    multivalued: true
    description: >-
      Quality-control flags assigned by Open Targets to the report. All source flags are
      retained; see ReportQualityControlEnum.

  trial_drug:
    slot_uri: sagebrain:trial_drug
    range: Compound
    multivalued: true
    required: true
    description: >-
      A ChEMBL-resolved compound studied in the trial. A local slot links trials to
      Compound nodes; biolink:clinical_trial_interventions has a different range.

      Trials without a ChEMBL-resolved drug are excluded. Unmapped drug mentions within
      included trials are counted but do not produce links. Missing nodes or links
      therefore reflect identifier coverage as well as source coverage.

  clinical_trial_conditions:
    slot_uri: biolink:clinical_trial_conditions
    range: DiseaseOrPhenotypicFeature
    multivalued: true
    description: >-
      A disease or phenotype studied in the trial, linked through its source ontology
      identifier. Trials with no mapped condition remain in the graph with their drug
      links.

# ── classes ───────────────────────────────────────────────────────────────────

classes:

  Compound:
    class_uri: biolink:ChemicalEntity
    description: >-
      A molecule identified by its ChEMBL accession. Small molecules are typed as
      biolink:SmallMolecule; other modalities use biolink:ChemicalEntity and retain the
      source drug_type.

      The catalogue includes research compounds, so membership does not establish
      therapeutic use. Compounds referenced by associations but absent from the molecule
      dataset are emitted as typed stubs without inferred names or modalities.
    slots:
      - id
      - name
      - alt_label
      - drug_type
      - inchi_key
      - canonical_smiles
      - overall_clinical_stage
      - parent_molecule
    slot_usage:
      id:
        pattern: "^CHEMBL:CHEMBL\\d+$"
        description: >-
          ChEMBL accession under identifiers.org, using the full CHEMBL-prefixed
          accession as the local identifier.
      name:
        description: >-
          The preferred molecule name supplied by the source.

  Gene:
    class_uri: biolink:Gene
    description: >-
      A mechanism target identified by HGNC, with its approved symbol and taxon. HGNC
      identifiers align gene identity with the Reactome ingest. The source Ensembl
      identifier is retained on each association as original_object.
    slots:
      - id
      - name
      - in_taxon
    slot_usage:
      id:
        pattern: "^HGNC:\\d+$"
        description: >-
          HGNC identifier under identifiers.org, using the numeric accession as the
          local identifier.
      name:
        description: >-
          HGNC-approved gene symbol.

  DiseaseOrPhenotypicFeature:
    class_uri: biolink:DiseaseOrPhenotypicFeature
    description: >-
      A disease or phenotype referenced by an indication or trial. Nodes are typed from
      the source identifier prefix: MONDO, EFO, Orphanet, NCIT, and OTAR map to
      biolink:Disease; HP and MP to biolink:PhenotypicFeature; GO and OBA to the union
      class.

      The projection includes referenced terms and their labels, without the source
      ontology hierarchy. Unknown identifier prefixes fail validation.
    slots:
      - id
      - name
      - alt_label
    slot_usage:
      id:
        pattern: "^(EFO|obo|ORDO):[A-Za-z]+_[0-9]+$"
        description: >-
          Source ontology identifier expanded through the registered EFO, OBO, or
          Orphanet namespace.
      alt_label:
        description: >-
          Exact synonyms supplied by the source for disease and phenotype name
          resolution.

  CompoundToGeneAssociation:
    class_uri: biolink:ChemicalAffectsGeneAssociation
    description: >-
      A reified mechanism association between a compound and an HGNC gene, using
      biolink:affects. The Biolink class accommodates the compound subject, gene object,
      and general effect predicate.

      Source rows are expanded across drugs and resolved targets, then deduplicated by
      compound, gene, action, mechanism text, target type, and source Ensembl
      identifier. target_type distinguishes individual target claims from claims about
      groups whose members are enumerated.
    slots:
      - subject
      - object
      - predicate
      - action_type
      - mechanism_of_action
      - target_type
      - target_name
      - original_object
      - primary_knowledge_source
    slot_usage:
      subject:
        description: The compound.
        range: Compound
        pattern: "^CHEMBL:CHEMBL\\d+$"
      object:
        description: >-
          The target gene, normalized to HGNC.
        range: Gene
        pattern: "^HGNC:\\d+$"
      predicate:
        description: >-
          Fixed to biolink:affects. The source action is retained in action_type without
          imposing a more specific predicate mapping.
        equals_string: "biolink:affects"
      primary_knowledge_source:
        equals_string: "infores:open-targets"

  CompoundToDiseaseAssociation:
    class_uri: biolink:ChemicalOrDrugOrTreatmentToDiseaseOrPhenotypicFeatureAssociation
    description: >-
      A reified clinical indication associating a compound with a disease or phenotype
      for which it has been studied or approved. The association carries the source's
      maximum clinical stage and supporting report count.
    slots:
      - subject
      - object
      - predicate
      - max_clinical_stage
      - clinical_report_count
      - primary_knowledge_source
    slot_usage:
      subject:
        description: The compound.
        range: Compound
        pattern: "^CHEMBL:CHEMBL\\d+$"
      object:
        description: >-
          The disease or phenotype associated with the clinical indication.
        range: DiseaseOrPhenotypicFeature
      predicate:
        description: >-
          Fixed to biolink:treats_or_applied_or_studied_to_treat to cover both
          investigational and approved uses. biolink:treats and its subproperty
          sagebrain:used_to_treat would overstate investigational indications.
        equals_string: "biolink:treats_or_applied_or_studied_to_treat"
      primary_knowledge_source:
        equals_string: "infores:open-targets"

  ClinicalTrial:
    class_uri: biolink:ClinicalTrial
    description: >-
      A clinical trial identified by its ClinicalTrials.gov accession, projected from a
      CLINICAL_TRIAL record naming a ChEMBL-resolved drug. A trial is represented as a
      study node with stage, status, dates, and links to compounds and conditions.

      Trials can be joined to indication associations by drug and disease. This join
      does not reproduce the source's supporting report list: report identifiers are not
      emitted, and the indication and trial projections use different filters.
    slots:
      - id
      - name
      - trial_clinical_stage
      - clinical_trial_overall_status
      - trial_start_date
      - trial_stop_reason
      - trial_stop_reason_category
      - trial_quality_control
      - trial_drug
      - clinical_trial_conditions
    slot_usage:
      id:
        pattern: "^CLINICALTRIALS:NCT\\d{8}$"
        description: >-
          ClinicalTrials.gov accession normalized to uppercase and expanded through the
          identifiers.org clinicaltrials namespace. Invalid accessions fail validation.
          The registry URL is derivable from this identifier.
      name:
        required: false
        description: >-
          The registry title from trialOfficialTitle, when available. Generated text
          from the source title column is not substituted for a missing registry title.

  Dataset:
    class_uri: void:Dataset
    description: >-
      Metadata describing the release graph, including source, version, license,
      provenance, triple count, and interpretation notes. The local Oxigraph loader
      writes this metadata to the default graph. Deposit metadata must identify the
      destination snapshot graph.
    attributes:
      source:
        slot_uri: dcterms:source
        range: uriorcurie
        description: >-
          The Open Targets release output directory.
      source_integrity_digest:
        slot_uri: sagebrain:source_integrity_digest
        description: >-
          Digest of the release_data_integrity manifest, which records the upstream file
          checksums and anchors the downloaded release.
      version:
        slot_uri: pav:version
        description: >-
          The Open Targets release identifier.
      issued:
        slot_uri: dcterms:issued
        range: date
      license:
        slot_uri: dcterms:license
        range: uriorcurie
      bibliographic_citation:
        slot_uri: dcterms:bibliographicCitation
        range: uriorcurie
      triples:
        slot_uri: void:triples
        range: integer
      was_generated_by:
        slot_uri: prov:wasGeneratedBy
        range: uriorcurie

# ── model review ──────────────────────────────────────────────────────────────
#
# Direct sagebrain:targets and sagebrain:used_to_treat predicates are not emitted.
# Their Drug domain, treatment semantics, and lack of mechanism qualifiers need
# review before they can supplement the reified associations.
#
# Acceptance checks report local terms awaiting definition in sagebrain-model.
# Future extensions may add explicit indication-to-report links, trial literature,
# and compound cross-references. See opentargets/DESIGN.md for scope decisions.
